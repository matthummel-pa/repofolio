name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.0', '8.2' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  js-lint:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check block script
        run: node --check assets/js/block.js
